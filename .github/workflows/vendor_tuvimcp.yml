name: Vendor TuViMCP engine

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  vendor:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendor pinned TuViMCP source
        shell: bash
        run: |
          set -euo pipefail
          REV="667c68f564e135cae207df3471273f639fa2feb4"
          curl -L --fail --retry 3 "https://github.com/nmhaaa3218/TuViMCP/archive/${REV}.tar.gz" -o /tmp/tuvimcp.tar.gz
          rm -rf /tmp/tuvimcp
          mkdir -p /tmp/tuvimcp
          tar -xzf /tmp/tuvimcp.tar.gz -C /tmp/tuvimcp --strip-components=1
          rm -rf vendor/tuvi_mcp
          mkdir -p vendor
          cp -a /tmp/tuvimcp/tuvi_mcp vendor/tuvi_mcp
          printf '%s\n' '# Local vendored TuViMCP engine.' > vendor/__init__.py
          printf '%s\n' '# Vendored from nmhaaa3218/TuViMCP at commit 667c68f564e135cae207df3471273f639fa2feb4.' > vendor/tuvi_mcp/VENDORED_FROM.txt
          printf '%s\n' 'Source: https://github.com/nmhaaa3218/TuViMCP' >> vendor/tuvi_mcp/VENDORED_FROM.txt
          printf '%s\n' 'License: MIT' >> vendor/tuvi_mcp/VENDORED_FROM.txt

      - name: Commit vendored engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor
          if git diff --cached --quiet; then
            echo "No vendor changes."
            exit 0
          fi
          git commit -m "Vendor TuViMCP engine [skip ci]"
          git push
